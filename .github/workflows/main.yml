name: Unit test bluesnap-sdk-flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
jobs:
  ui_test:
    timeout-minutes: 30
    strategy:
        fail-fast: false
        matrix:
            runner: [self-hosted, ubuntu-latest]

    runs-on: ${{ matrix.runner }}
    steps:
    - name: Check Out Code
      uses: actions/checkout@v3 

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Move to example  
      run: cd example

    - name: Get Dependencies
      run: flutter pub get

    - name: Analyze Dart
      run: flutter analyze
      
    - name: Run Flutter Tests
      run: flutter test

  unit_test:
    timeout-minutes: 30
    strategy:
        fail-fast: false
        matrix:
            runner: [self-hosted, ubuntu-latest]

    runs-on: ${{ matrix.runner }}
    steps:
    - name: Check Out Code
      uses: actions/checkout@v3 

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get
    - name: Analyze Dart
      run: flutter analyze
    - name: Run Flutter Tests
      run: flutter test